<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Management System</title>
<style>
:root{--n:#0f2a43;--t:#0d9488;--bg:#f1f5f9;--b:#e2e8f0;--m:#64748b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:#0f172a;display:flex;min-height:100vh}
aside{width:230px;background:var(--n);color:#fff;padding:22px 14px;flex-shrink:0}
aside h1{font-size:1.05rem;margin:0 8px 4px}aside small{display:block;margin:0 8px 22px;opacity:.65}
aside button{display:flex;justify-content:space-between;width:100%;background:none;border:0;color:#cbd5e1;padding:10px;border-radius:8px;font:inherit;cursor:pointer;text-align:left}
aside button.on,aside button:hover{background:#ffffff1f;color:#fff}
main{flex:1;padding:24px;min-width:0}h2{margin:0 0 16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--b);border-radius:10px;padding:14px}.stat span{color:var(--m);font-size:.85rem}.stat b{display:block;font-size:1.6rem;margin-top:2px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tools input[type=search]{flex:1;min-width:180px}
input,select,button{font:inherit;padding:9px 11px;border:1px solid #cbd5e1;border-radius:8px;background:#fff}
.p{background:var(--t);color:#fff;border:0;cursor:pointer;font-weight:600}.g{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f59e0b}
.tw{background:#fff;border:1px solid var(--b);border-radius:10px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--b);white-space:nowrap}
th{background:#f8fafc;color:var(--m);cursor:pointer;user-select:none}tr:last-child td{border:0}
.gr{display:inline-block;min-width:26px;text-align:center;padding:2px 8px;border-radius:99px;font-weight:700;font-size:.8rem;color:#fff}
.A{background:#16a34a}.B{background:#0d9488}.C{background:#ca8a04}.D{background:#ea580c}.F{background:#dc2626}
td button{padding:4px 9px;font-size:.82rem;cursor:pointer;margin-right:4px}td .d{color:#dc2626}
dialog{border:0;border-radius:14px;padding:22px;width:min(480px,94vw)}dialog::backdrop{background:#0f172a99}
dialog form{display:grid;grid-template-columns:1fr 1fr;gap:10px}dialog label{font-size:.82rem;color:var(--m);display:grid;gap:4px}
dialog .w,dialog .row{grid-column:1/-1}dialog .row{display:flex;gap:8px;justify-content:flex-end}.er{color:#dc2626;font-size:.85rem;grid-column:1/-1;min-height:1em}
@media(max-width:760px){body{flex-direction:column}aside{width:100%;display:flex;gap:6px;overflow:auto;padding:12px}aside h1,aside small{display:none}aside button{white-space:nowrap;width:auto;gap:8px}}
</style></head><body>
<aside><h1>Student Management</h1><small>Admin panel</small><div id="nav"></div></aside>
<main><h2 id="ttl">All students</h2><div class="stats" id="st"></div>
<div class="tools"><input type="search" id="q" placeholder="Search name, roll no or email" aria-label="Search"><select id="so" aria-label="Sort"><option value="name">Sort: Name</option><option value="roll">Sort: Roll no</option><option value="marks">Sort: Marks</option><option value="att">Sort: Attendance</option></select><button class="g" id="csv">Export CSV</button><button class="p" id="add">+ Add student</button></div>
<div class="tw"><table><thead><tr><th>Roll no</th><th>Name</th><th>Course</th><th>Sem</th><th>Marks</th><th>Grade</th><th>Attendance</th><th>Contact</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></main>
<dialog id="dlg"><h3 id="dt" style="margin-top:0">Add student</h3><form id="f" method="dialog">
<label>Roll no<input id="roll" required maxlength="12"></label><label>Full name<input id="name" required maxlength="60"></label>
<label>Course<select id="course"><option>BSCS</option><option>BSSE</option><option>BSIT</option><option>BBA</option><option>BSEE</option></select></label>
<label>Semester<input id="sem" type="number" min="1" max="8" required></label><label>Email<input id="email" type="email" required></label><label>Phone<input id="phone" required pattern="[0-9+\- ]{7,15}"></label>
<label>Marks (0-100)<input id="marks" type="number" min="0" max="100" required></label><label>Attendance %<input id="att" type="number" min="0" max="100" required></label>
<div class="er" id="er"></div><div class="row"><button type="button" class="g" id="cx">Cancel</button><button class="p">Save</button></div></form></dialog>
<script>
const $=s=>document.querySelector(s),KEY='sms-v3',esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch{}if(!Array.isArray(S))S=[];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}};
let cf='All',edit=null,sortDir=1;
const grade=m=>m>=85?'A':m>=70?'B':m>=55?'C':m>=40?'D':'F';
const courses=()=>['All',...new Set(S.map(s=>s.course))];
function render(){
 const q=$('#q').value.toLowerCase(),k=$('#so').value;
 const L=S.filter(s=>(cf==='All'||s.course===cf)&&(s.name+s.roll+s.email).toLowerCase().includes(q)).sort((a,b)=>(typeof a[k]==='number'?b[k]-a[k]:String(a[k]).localeCompare(b[k]))*sortDir);
 $('#ttl').textContent=cf==='All'?'All students':cf+' students';
 $('#nav').innerHTML=courses().map(c=>`<button class="${c===cf?'on':''}" data-c="${esc(c)}"><span>${esc(c)}</span><span>${c==='All'?S.length:S.filter(s=>s.course===c).length}</span></button>`).join('');
 document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{cf=b.dataset.c;render()});
 const avg=a=>a.length?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1):'0';const top=[...L].sort((a,b)=>b.marks-a.marks)[0];
 $('#st').innerHTML=[['Students',L.length],['Average marks',avg(L.map(s=>s.marks))],['Average attendance',avg(L.map(s=>s.att))+'%'],['Top scorer',top?esc(top.name.split(' ')[0])+' ('+top.marks+')':'-'],['At risk (<60% att.)',L.filter(s=>s.att<60).length]].map(x=>`<div class="stat"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');
 $('#tb').innerHTML=L.length?L.map(s=>`<tr><td>${esc(s.roll)}</td><td><b>${esc(s.name)}</b></td><td>${esc(s.course)}</td><td>${s.sem}</td><td>${s.marks}</td><td><span class="gr ${grade(s.marks)}">${grade(s.marks)}</span></td><td>${s.att}%</td><td>${esc(s.email)}<br><small>${esc(s.phone)}</small></td><td><button data-e="${esc(s.roll)}">Edit</button><button class="d" data-d="${esc(s.roll)}">Delete</button></td></tr>`).join(''):'<tr><td colspan="9">No students match. Change the filter or add a new student.</td></tr>';
 document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>open(b.dataset.e));
 document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(confirm('Delete this student?')){S=S.filter(s=>s.roll!==b.dataset.d);save();render()}});
}
const F=['roll','name','course','sem','email','phone','marks','att'];
function open(r){edit=r||null;$('#dt').textContent=r?'Edit student':'Add student';$('#er').textContent='';const s=S.find(x=>x.roll===r)||{};F.forEach(f=>$('#'+f).value=s[f]??'');$('#roll').disabled=!!r;$('#dlg').showModal()}
$('#add').onclick=()=>open();$('#cx').onclick=()=>$('#dlg').close();
$('#f').onsubmit=e=>{const o={};F.forEach(f=>o[f]=$('#'+f).value.trim());['sem','marks','att'].forEach(f=>o[f]=+o[f]);
 if(!edit&&S.some(s=>s.roll.toLowerCase()===o.roll.toLowerCase())){e.preventDefault();$('#er').textContent='This roll number already exists.';return}
 if(edit)S=S.map(s=>s.roll===edit?{...o,roll:edit}:s);else S.push(o);save();render()};
$('#q').oninput=render;$('#so').onchange=render;
document.querySelectorAll('th').forEach((h,i)=>{const m=['roll','name','course','sem','marks','marks','att','email'][i];if(m)h.onclick=()=>{$('#so').value=['name','roll','marks','att'].includes(m)?m:'name';sortDir=1;render()}});
$('#csv').onclick=()=>{const q=v=>'"'+String(v).replace(/"/g,'""')+'"';const r=[F.concat('grade').join(','),...S.map(s=>F.map(f=>q(s[f])).concat(grade(s.marks)).join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([r],{type:'text/csv'}));a.download='students.csv';a.click()};
render();
</script>
<script>
(()=>{const P={"k": "sms", "t": "Student Management", "c": "#0d9488", "bg": "#0f2a43"};
const AK='auth2-'+P.k,SK='sess-'+P.k,$=s=>document.querySelector(s);
const st=document.createElement('style');
st.textContent=`#lgo{position:fixed;inset:0;z-index:9999;background:${P.bg};display:flex;align-items:center;justify-content:center;padding:16px;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#lgo[hidden]{display:none}#lgo form{background:#fff;color:#1f2937;width:min(380px,100%);border-radius:16px;padding:28px;display:grid;gap:12px;box-shadow:0 20px 60px #0006}
#lgo h1{margin:0;font-size:1.4rem}#lgo p{margin:0;color:#6b7280;font-size:.9rem}#lgo label{display:grid;gap:4px;font-size:.82rem;color:#6b7280}
#lgo input{font:inherit;padding:11px 12px;border:1px solid #d1d5db;border-radius:8px}#lgo input:focus-visible,#lgo button:focus-visible{outline:3px solid #f59e0b}
#lgo button{font:inherit;font-weight:600;padding:12px;border:0;border-radius:8px;background:${P.c};color:#fff;cursor:pointer}
#lge{color:#b91c1c;font-size:.85rem;min-height:1.1em}#lgb{position:fixed;left:12px;bottom:12px;z-index:60;font:inherit;font-size:.85rem;padding:7px 12px;border-radius:99px;border:1px solid #0003;background:#fff;color:#111;cursor:pointer;box-shadow:0 2px 8px #0003}`;
document.head.append(st);
const o=document.createElement('div');o.id='lgo';o.hidden=true;
o.innerHTML=`<form id="lgf" autocomplete="on"><h1>${P.t}</h1><p id="lgm"></p>
<label>Username<input id="lgu" required maxlength="30" autocomplete="username"></label>
<label>Password<input id="lgp" type="password" required autocomplete="current-password"></label>
<label id="lgcw">Confirm password<input id="lgc" type="password" minlength="6" autocomplete="new-password"></label>
<div id="lge" role="alert"></div><button id="lgs"></button></form>`;
document.body.append(o);
const lb=document.createElement('button');lb.id='lgb';lb.hidden=true;document.body.append(lb);
async function h(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch{let x=5381;for(const c of s)x=(x*33^c.charCodeAt(0))>>>0;return 'f'+x}}
const get=()=>{try{return JSON.parse(localStorage.getItem(AK))}catch{return null}};const acct=async()=>get()||{u:'admin',h:await h('admin:admin123')};
const lock=on=>[...document.body.children].forEach(e=>{if(e!==o&&e!==lb&&e.tagName!=='SCRIPT'&&e.tagName!=='STYLE'){on?e.setAttribute('inert',''):e.removeAttribute('inert')}});
function show(){const a=true;o.hidden=false;lb.hidden=true;lock(true);$('#lgf').reset();$('#lge').textContent='';
 $('#lgm').textContent=a?'Sign in to continue.':'First time here? Create your admin account.';
 $('#lgs').textContent=a?'Sign in':'Create account';$('#lgcw').style.display=a?'none':'grid';$('#lgc').required=!a;
 $('#lgp').autocomplete=a?'current-password':'new-password';setTimeout(()=>$('#lgu').focus(),50)}
function enter(u){try{sessionStorage.setItem(SK,u)}catch{}o.hidden=true;lock(false);lb.hidden=false;lb.textContent='Logout ('+u+')'}
$('#lgf').onsubmit=async e=>{e.preventDefault();const u=$('#lgu').value.trim().toLowerCase(),p=$('#lgp').value,a=await acct();if(a.u===u&&a.h===await h(u+':'+p))enter(u);else $('#lge').textContent='Wrong username or password.'};
lb.onclick=()=>{try{sessionStorage.removeItem(SK)}catch{}show()};
(async()=>{let s=null;try{s=sessionStorage.getItem(SK)}catch{}const a=await acct();if(s&&a.u===s)enter(s);else show()})();
})();
</script>
</body></html>
